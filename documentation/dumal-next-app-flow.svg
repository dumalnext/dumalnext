<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-lg" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#002060" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="grad-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001845"/>
      <stop offset="100%" stop-color="#002878"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#002060"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="960" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1600" height="6" fill="#002060"/>
  <rect x="0" y="6" width="1600" height="3" fill="#F59E0B"/>

  <!-- Header Banner -->
  <rect x="40" y="28" width="1520" height="76" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow)"/>
  <text x="64" y="60" font-size="22" font-weight="800" fill="#002060">DUMAL-NEXT: COMPLETE APPLICATION FLOW &amp; NAVIGATION ARCHITECTURE</text>
  <text x="64" y="84" font-size="13" font-weight="500" fill="#64748B">Dumalneg National High School (DepEd School ID: 300017) | Multi-Portal Navigation, Triggers &amp; State Transitions</text>
  
  <!-- Legend Badges -->
  <g transform="translate(1080, 52)">
    <rect x="0" y="0" width="100" height="28" rx="4" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="50" y="18" font-size="11" font-weight="700" fill="#3730A3" text-anchor="middle">Student</text>
    
    <rect x="110" y="0" width="100" height="28" rx="4" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <text x="160" y="18" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">Faculty</text>
    
    <rect x="220" y="0" width="100" height="28" rx="4" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1"/>
    <text x="270" y="18" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">Admin/Reg</text>
    
    <rect x="330" y="0" width="100" height="28" rx="4" fill="#F3E8FF" stroke="#E9D5FF" stroke-width="1"/>
    <text x="380" y="18" font-size="11" font-weight="700" fill="#6B21A8" text-anchor="middle">IT Support</text>
  </g>

  <!-- Central Entry Point Node: Public Gateway & Supabase Auth -->
  <g transform="translate(560, 126)">
    <rect x="0" y="0" width="480" height="84" rx="8" fill="url(#grad-navy)" filter="url(#shadow-lg)"/>
    <rect x="0" y="0" width="480" height="3" fill="#F59E0B" rx="1"/>
    <text x="240" y="32" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Public Gateway &amp; Authentication Layer</text>
    <text x="240" y="52" font-size="12" fill="#E2E8F0" text-anchor="middle">Supabase Auth SSR | Cookie Sessions | 6-Digit Email OTP Verification</text>
    <text x="240" y="70" font-size="11" font-weight="600" fill="#FDE68A" text-anchor="middle">Routes by Role: Learner (student) | Faculty (teacher) | Registrar (admin) | System (it_support)</text>
  </g>

  <!-- Distribution Lines -->
  <path d="M 800 210 L 800 240 L 210 240 L 210 264" fill="none" stroke="#002060" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 800 210 L 800 240 L 600 240 L 600 264" fill="none" stroke="#002060" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 800 210 L 800 240 L 1000 240 L 1000 264" fill="none" stroke="#002060" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 800 210 L 800 240 L 1390 240 L 1390 264" fill="none" stroke="#002060" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== COLUMN 1: STUDENT PORTAL ==================== -->
  <g transform="translate(40, 268)">
    <!-- Column Header -->
    <rect x="0" y="0" width="340" height="42" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="42" fill="#4338CA" rx="1"/>
    <text x="16" y="26" font-size="14" font-weight="800" fill="#312E81">1. Student Portal (@dumalnext/student)</text>
    
    <!-- Step 1: Landing -->
    <rect x="0" y="54" width="340" height="72" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="76" font-size="13" font-weight="700" fill="#002060">Portal Home (/) </text>
    <text x="14" y="94" font-size="11" fill="#475569">Hero banner, S.Y. status notice, Video guide</text>
    <text x="14" y="112" font-size="11" font-weight="600" fill="#2563EB">&gt; Auth Tab: Sign In (Email/Pass) vs. Register</text>
    
    <!-- Step 2: OTP Modal -->
    <rect x="0" y="136" width="340" height="66" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/>
    <text x="14" y="158" font-size="12" font-weight="700" fill="#1E293B">6-Digit OTP Modal</text>
    <text x="14" y="174" font-size="11" fill="#64748B">Segmented inputs with auto-advance &amp; 60s cooldown</text>
    <text x="14" y="190" font-size="10.5" font-weight="600" fill="#059669">Redirects to /enroll or Dashboard upon verify</text>

    <!-- Step 3: Online Enrollment Stepper -->
    <rect x="0" y="212" width="340" height="218" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="234" font-size="13" font-weight="700" fill="#002060">Guided Enrollment (/enroll)</text>
    <text x="14" y="250" font-size="10.5" font-weight="600" fill="#F59E0B">DepEd Basic Education 5-Step Stepper</text>
    
    <g transform="translate(14, 260)" font-size="11" fill="#334155">
      <text x="0" y="12" font-weight="600">Step 1: Classification &amp; Grade Level (7-12)</text>
      <text x="0" y="28" font-weight="600">Step 2: Learner Profile, LRN (12-digit), Isnag/4Ps</text>
      <text x="0" y="44" font-weight="600">Step 3: Family Info &amp; Emergency Priority</text>
      <text x="0" y="60" font-weight="600">Step 4: JHS Special (SPS) or SHS Track/Strand</text>
      <text x="0" y="76" font-weight="600">Step 5: Client-Side Document Compressor</text>
      <text x="12" y="94" font-size="10.5" fill="#64748B">&gt; PSA &amp; Form 138 scaled &lt; 350KB via Canvas</text>
      <text x="12" y="110" font-size="10.5" fill="#64748B">&gt; LocalStorage draft autosave prevents data loss</text>
      <text x="0" y="132" font-weight="700" fill="#2563EB">Submit Application &gt; Changes status to 'submitted'</text>
    </g>

    <!-- Step 4: Status Tracker & Enrollment Slip -->
    <rect x="0" y="440" width="340" height="96" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="462" font-size="13" font-weight="700" fill="#002060">Application Tracker (/track)</text>
    <text x="14" y="480" font-size="11" fill="#475569">Timeline: Draft &gt; Submitted &gt; Review &gt; Approved</text>
    <text x="14" y="498" font-size="11" fill="#DC2626">If 'Revision': Re-upload modal with registrar remarks</text>
    <text x="14" y="516" font-size="11" font-weight="700" fill="#059669">&gt; Download DepEd Enrollment Slip PDF (pdf-lib)</text>

    <!-- Step 5: Section View -->
    <rect x="0" y="546" width="340" height="76" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="568" font-size="13" font-weight="700" fill="#002060">Class Section Roster (/section)</text>
    <text x="14" y="586" font-size="11" fill="#475569">View assigned section, class adviser &amp; room</text>
    <text x="14" y="604" font-size="11" fill="#475569">Weekly class subject timetable schedule</text>
  </g>

  <!-- ==================== COLUMN 2: FACULTY WORKSTATION ==================== -->
  <g transform="translate(430, 268)">
    <!-- Column Header -->
    <rect x="0" y="0" width="340" height="42" rx="6" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="42" fill="#D97706" rx="1"/>
    <text x="16" y="26" font-size="14" font-weight="800" fill="#92400E">2. Faculty Workstation (@dumalnext/teacher)</text>

    <!-- Overview -->
    <rect x="0" y="54" width="340" height="96" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="76" font-size="13" font-weight="700" fill="#002060">Faculty Dashboard (/)</text>
    <text x="14" y="94" font-size="11" fill="#475569">Assigned classes today &amp; active period banner</text>
    <text x="14" y="112" font-size="11" fill="#475569">Total student count &amp; teaching workload units</text>
    <text x="14" y="130" font-size="11" font-weight="600" fill="#D97706">School calendar &amp; grading period milestones</text>

    <!-- Teaching Schedule -->
    <rect x="0" y="160" width="340" height="116" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="182" font-size="13" font-weight="700" fill="#002060">Teaching Schedule (/schedule)</text>
    <text x="14" y="200" font-size="11" fill="#475569">Weekly master grid (Monday - Friday, 7 AM - 5 PM)</text>
    <text x="14" y="218" font-size="11" fill="#475569">Room assignment details &amp; building locators</text>
    <text x="14" y="236" font-size="11" fill="#475569">Subject syllabus &amp; section details card</text>
    <text x="14" y="254" font-size="11" font-weight="700" fill="#2563EB">&gt; Print / Export personal weekly teaching load</text>

    <!-- Advisory Class Section Roster -->
    <rect x="0" y="286" width="340" height="140" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="308" font-size="13" font-weight="700" fill="#002060">Advisory Class Roster (/roster)</text>
    <text x="14" y="326" font-size="11" fill="#475569">Assigned advisory section student directory</text>
    <text x="14" y="344" font-size="11" fill="#475569">Learner reference details (LRN, 4Ps, Isnag IP)</text>
    <text x="14" y="362" font-size="11" fill="#475569">Emergency guardian contact telephone directory</text>
    <text x="14" y="380" font-size="11" font-weight="700" fill="#059669">&gt; One-click attendance sheet export (PDF/Excel)</text>
    <text x="14" y="406" font-size="11" fill="#64748B">Adviser remarks &amp; student verification notes</text>

    <!-- Profile & Credentials -->
    <rect x="0" y="436" width="340" height="80" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="458" font-size="13" font-weight="700" fill="#002060">Faculty Profile (/profile)</text>
    <text x="14" y="476" font-size="11" fill="#475569">DepEd Employee Number, Plantilla position</text>
    <text x="14" y="494" font-size="11" fill="#475569">Specialization (JHS Major / SHS Strand Area)</text>
  </g>

  <!-- ==================== COLUMN 3: ADMIN & REGISTRAR ==================== -->
  <g transform="translate(820, 268)">
    <!-- Column Header -->
    <rect x="0" y="0" width="350" height="42" rx="6" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="42" fill="#16A34A" rx="1"/>
    <text x="16" y="26" font-size="14" font-weight="800" fill="#14532D">3. Admin &amp; Registrar (@dumalnext/admin)</text>

    <!-- Application Adjudication -->
    <rect x="0" y="54" width="350" height="154" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="76" font-size="13" font-weight="700" fill="#002060">Application Adjudication (/adjudication)</text>
    <text x="14" y="94" font-size="11" fill="#475569">High-density data grid with live Supabase subscriptions</text>
    <text x="14" y="112" font-size="11" fill="#475569">Faceted filters: Grade (7-12), Track, Status, S.Y.</text>
    <text x="14" y="130" font-size="11.5" font-weight="700" fill="#2563EB">Split-Screen Review Modal:</text>
    <text x="24" y="148" font-size="10.5" fill="#334155">&gt; Left: Demographics, LRN, 4Ps, Previous School</text>
    <text x="24" y="164" font-size="10.5" fill="#334155">&gt; Right: Pan/Zoom viewer for PSA &amp; Form 138 cards</text>
    <text x="14" y="186" font-size="11" font-weight="700" fill="#059669">Actions: [Approve &amp; Assign] or [Return with Reasons]</text>

    <!-- Section Quota Console -->
    <rect x="0" y="218" width="350" height="114" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="240" font-size="13" font-weight="700" fill="#002060">Section Quota Console (/sections)</text>
    <text x="14" y="258" font-size="11" font-weight="700" fill="#DC2626">DepEd Strict 40-Student Capacity Enforcement</text>
    <text x="14" y="276" font-size="11" fill="#475569">Visual capacity progress meters (Green &lt; 35 | Red = 40)</text>
    <text x="14" y="294" font-size="11" fill="#475569">Automated section assignment upon approval</text>
    <text x="14" y="312" font-size="11" font-weight="700" fill="#059669">&gt; Export DepEd School Form 1 (SF-1) Masterlist</text>

    <!-- Schedule Deconfliction -->
    <rect x="0" y="342" width="350" height="136" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="364" font-size="13" font-weight="700" fill="#002060">Schedule Deconfliction (/scheduling)</text>
    <text x="14" y="382" font-size="11" fill="#475569">Master Weekly Timetable Matrix (5 Days x 10 Periods)</text>
    <text x="14" y="400" font-size="11" font-weight="700" fill="#D97706">3-Way Clash Detection Engine:</text>
    <text x="24" y="418" font-size="10.5" fill="#334155">&gt; Teacher double-booking prevention</text>
    <text x="24" y="434" font-size="10.5" fill="#334155">&gt; Classroom room allocation collision</text>
    <text x="24" y="450" font-size="10.5" fill="#334155">&gt; Section subject slot overlap</text>
    <text x="14" y="468" font-size="11" font-weight="600" fill="#DC2626">Real-time red conflict alerts prevent saving clashes</text>

    <!-- Control Room & Subjects -->
    <rect x="0" y="488" width="350" height="96" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="510" font-size="13" font-weight="700" fill="#002060">Control Room (/control-room, /subjects)</text>
    <text x="14" y="528" font-size="11" font-weight="700" fill="#2563EB">Enrollment Window Toggle (Open / Close intake)</text>
    <text x="14" y="546" font-size="11" fill="#475569">Broadcast emergency system announcement banner</text>
    <text x="14" y="564" font-size="11" fill="#475569">Curriculum learning area catalog &amp; strand units</text>
  </g>

  <!-- ==================== COLUMN 4: IT SUPPORT ==================== -->
  <g transform="translate(1220, 268)">
    <!-- Column Header -->
    <rect x="0" y="0" width="340" height="42" rx="6" fill="#F3E8FF" stroke="#E9D5FF" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="42" fill="#7E22CE" rx="1"/>
    <text x="16" y="26" font-size="14" font-weight="800" fill="#581C87">4. IT Support (@dumalnext/it-support)</text>

    <!-- Academic Calendar -->
    <rect x="0" y="54" width="340" height="130" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="76" font-size="13" font-weight="700" fill="#002060">Calendar Manager (/calendar)</text>
    <text x="14" y="94" font-size="11" font-weight="700" fill="#7E22CE">Zero Hardcoding Architecture</text>
    <text x="14" y="112" font-size="11" fill="#475569">Dynamic School Year creator (e.g., 2026-2027)</text>
    <text x="14" y="130" font-size="11" fill="#475569">Quarter lifecycle management (Q1 - Q4)</text>
    <text x="14" y="148" font-size="11" fill="#475569">Intake start &amp; end dates with auto-expiration</text>
    <text x="14" y="168" font-size="10.5" font-weight="600" fill="#059669">Single active term enforcement via atomic RPC</text>

    <!-- Facilities -->
    <rect x="0" y="194" width="340" height="114" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="216" font-size="13" font-weight="700" fill="#002060">Campus Facilities (/facilities)</text>
    <text x="14" y="234" font-size="11" fill="#475569">Building &amp; floor registry</text>
    <text x="14" y="252" font-size="11" fill="#475569">Classroom inventory &amp; physical desk capacities</text>
    <text x="14" y="270" font-size="11" fill="#475569">Specialized lab designations (Science, ICT, TVL)</text>
    <text x="14" y="290" font-size="11" fill="#64748B">Room allocation state for scheduling engine</text>

    <!-- User RBAC -->
    <rect x="0" y="318" width="340" height="126" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="340" font-size="13" font-weight="700" fill="#002060">User &amp; RBAC Directory (/users)</text>
    <text x="14" y="358" font-size="11" fill="#475569">Global staff directory across 4 workstations</text>
    <text x="14" y="376" font-size="11" fill="#475569">Dispatch email invitations for teachers &amp; staff</text>
    <text x="14" y="394" font-size="11" fill="#475569">Role switcher &amp; permissions auditor</text>
    <text x="14" y="412" font-size="11" font-weight="600" fill="#DC2626">Privilege escalation prevention guards</text>
    <text x="14" y="430" font-size="10.5" fill="#64748B">Account deactivation &amp; password reset dispatch</text>

    <!-- Diagnostics -->
    <rect x="0" y="454" width="340" height="110" rx="6" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <text x="14" y="476" font-size="13" font-weight="700" fill="#002060">Diagnostics &amp; Audit (/diagnostics)</text>
    <text x="14" y="494" font-size="11" fill="#475569">Live Supabase database connection health &amp; ping</text>
    <text x="14" y="512" font-size="11" fill="#475569">System-wide audit log of security &amp; term events</text>
    <text x="14" y="530" font-size="11" fill="#475569">Storage quota utilization monitor (PSA scans)</text>
    <text x="14" y="548" font-size="10.5" font-weight="600" fill="#2563EB">Export audit compliance logs</text>
  </g>

  <!-- Footer Banner -->
  <rect x="40" y="904" width="1520" height="38" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="64" y="928" font-size="12" font-weight="600" fill="#002060">DUMALNEG NATIONAL HIGH SCHOOL (300017)</text>
  <text x="800" y="928" font-size="11.5" fill="#64748B" text-anchor="middle">Technology Stack: Next.js 16 (App Router) | React 19 | TypeScript 5 | Tailwind CSS v4 | Supabase PostgreSQL 15 | pdf-lib</text>
  <text x="1536" y="928" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="end">Production System Documentation</text>
</svg>
